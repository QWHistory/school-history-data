<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校史档案</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #f8f7f4;
    color: #2b2b2b;
    line-height: 1.8;
    padding: 2rem 1rem;
  }
  .container { max-width: 780px; margin: 0 auto; }

  /* 页面标题 */
  .page-title {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding-bottom: 1rem;
    margin-bottom: 2rem;
    border-bottom: 2px solid #d4cfc6;
    color: #3d3a35;
  }

  /* 每条档案卡片 */
  .entry {
    background: #ffffff;
    border-radius: 6px;
    padding: 1.6rem 1.8rem;
    margin-bottom: 1.2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    border: 1px solid #eae6df;
  }

  /* 标题行 */
  .entry-title {
    font-size: 1.15rem;
    font-weight: 600;
    color: #1f1f1f;
    margin-bottom: 0.6rem;
  }

  /* 元信息行：分区、投稿人、时间 */
  .entry-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.2rem;
    font-size: 0.82rem;
    color: #8a857c;
    margin-bottom: 1rem;
  }
  .tag {
    display: inline-block;
    background: #ece8e1;
    color: #5a544a;
    padding: 0.1rem 0.6rem;
    border-radius: 3px;
    font-size: 0.78rem;
  }

  /* 正文：核心要求——保留换行 */
  .entry-body {
    white-space: pre-wrap;      /* 保留 \n，自动换行 */
    word-break: break-word;     /* 长单词/URL 强制断行 */
    font-size: 0.95rem;
    color: #3a3a3a;
    margin-bottom: 1rem;
  }

  /* 附件区域 */
  .attachment-label {
    font-size: 0.8rem;
    color: #9e9890;
    margin-bottom: 0.4rem;
  }
  .attachment-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
  }
  .attachment-item {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.8rem;
    background: #f2efe9;
    border: 1px solid #e2ddd4;
    border-radius: 4px;
    font-size: 0.82rem;
    color: #5a544a;
    text-decoration: none;
    transition: background 0.15s;
  }
  .attachment-item:hover { background: #e8e3da; }
  .attachment-item .icon { font-size: 0.95rem; }

  /* 空状态 */
  .empty { text-align: center; color: #aaa; padding: 3rem 0; }
</style>
</head>
<body>
<div class="container">

  <h1 class="page-title">校史档案</h1>
  <div id="list"></div>

</div>

<script>
  // ====== 配置 ======
  const GITHUB_USER = "QWHistory";
  const GITHUB_REPO = "school-history-data";

  // 用 jsDelivr 读取 data.json（国内加速）
  const DATA_URL = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@main/data.json`;

  // jsDelivr 文件直链前缀
  const CDN_PREFIX = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@main/`;

  // 判断是否为图片（仅用于决定是否显示“预览”按钮，但绝不作为卡片主视觉）
  function isImage(path) {
    return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(path);
  }

  // 格式化时间戳为 YYYY年MM月DD日
  function formatDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,"0")}月${String(d.getDate()).padStart(2,"0")}日`;
  }

  // 从路径中提取文件名
  function fileName(path) {
    return path.split("/").pop() || path;
  }

  // 根据扩展名返回图标（纯文本符号，不依赖外部库）
  function fileIcon(path) {
    const ext = (path.split(".").pop() || "").toLowerCase();
    if (["jpg","jpeg","png","gif","webp","svg"].includes(ext)) return "🖼️";
    if (["pdf"].includes(ext)) return "📄";
    if (["doc","docx"].includes(ext)) return "📝";
    if (["xls","xlsx","csv"].includes(ext)) return "📊";
    if (["ppt","pptx"].includes(ext)) return "📽️";
    if (["zip","rar","7z"].includes(ext)) return "🗜️";
    if (["txt","md"].includes(ext)) return "📃";
    return "📎";
  }

  // 渲染单条档案
  function renderEntry(item) {
    const card = document.createElement("div");
    card.className = "entry";

    // 标题
    const title = document.createElement("div");
    title.className = "entry-title";
    title.textContent = item["内容标题"] || "无标题";
    card.appendChild(title);

    // 元信息
    const meta = document.createElement("div");
    meta.className = "entry-meta";

    const category = item["分区"];
    if (category) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = category;
      meta.appendChild(tag);
    }

    const author = item["投稿人昵称"];
    if (author) {
      const span = document.createElement("span");
      span.textContent = `投稿：${author}`;
      meta.appendChild(span);
    }

    const time = formatDate(item["投稿时间"]);
    if (time) {
      const span = document.createElement("span");
      span.textContent = time;
      meta.appendChild(span);
    }

    card.appendChild(meta);

    // 正文：保留换行
    const body = document.createElement("div");
    body.className = "entry-body";
    body.textContent = item["内容详述"] || "暂无详细内容。";
    card.appendChild(body);

    // 附件区域（文本主导，不放大图）
    const attachments = item["attachments"];
    if (Array.isArray(attachments) && attachments.length > 0) {
      const label = document.createElement("div");
      label.className = "attachment-label";
      label.textContent = `附件（${attachments.length}）`;
      card.appendChild(label);

      const list = document.createElement("div");
      list.className = "attachment-list";

      attachments.forEach(path => {
        const a = document.createElement("a");
        a.className = "attachment-item";
        a.href = CDN_PREFIX + path.replace(/^\//, "");
        a.target = "_blank";
        a.rel = "noopener";

        // 非图片强制下载；图片在新标签打开预览
        if (!isImage(path)) {
          a.setAttribute("download", fileName(path));
        }

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = fileIcon(path);
        a.appendChild(icon);

        const name = document.createElement("span");
        name.textContent = fileName(path);
        a.appendChild(name);

        list.appendChild(a);
      });

      card.appendChild(list);
    }

    return card;
  }

  // 主加载逻辑
  async function load() {
    const list = document.getElementById("list");
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        list.innerHTML = '<div class="empty">暂无档案记录</div>';
        return;
      }

      // 按投稿时间倒序（最新在前）
      data.sort((a, b) => (b["投稿时间"] || 0) - (a["投稿时间"] || 0));

      data.forEach(item => list.appendChild(renderEntry(item)));

    } catch (e) {
      console.error("加载失败:", e);
      list.innerHTML = '<div class="empty">数据加载失败，请稍后重试。</div>';
    }
  }

  load();
</script>
</body>
</html>
