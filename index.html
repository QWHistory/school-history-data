<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校史档案馆 - 时光印记</title>
<style>
  :root {
    --bg-body: #fafafa;
    --bg-surface: #ffffff;
    --bg-hover: #f3f4f6;
    --text-primary: #111827;
    --text-secondary: #4b5563;
    --text-tertiary: #9ca3af;
    --border-color: #e5e7eb;
    --primary: #000000;
    --primary-hover: #333333;
    
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
  }

  [data-theme="dark"] {
    --bg-body: #0d1117;
    --bg-surface: #161b22;
    --bg-hover: #21262d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --border-color: #30363d;
    --primary: #f0f6fc;
    --primary-hover: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    transition: background-color 0.3s, color 0.3s;
  }

  /* 网页背景微光效果 */
  .bg-glow {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 100vw; height: 100vh;
    background: radial-gradient(circle at 50% 0%, rgba(128, 128, 128, 0.1) 0%, transparent 60%);
    z-index: -1;
    pointer-events: none;
  }

  /* ================= 顶部导航 ================= */
  .navbar {
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  
  .nav-brand svg {
    width: 24px;
    height: 24px;
  }

  .btn-icon {
    background: none; border: 1px solid transparent; cursor: pointer; 
    color: var(--text-secondary); padding: 0.4rem; border-radius: var(--radius-md); 
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-color); }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon svg { width: 20px; height: 20px; }

  /* ================= 核心内容区 ================= */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 4rem 1.5rem;
    max-width: 800px;
    margin: 0 auto;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 1rem;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 99px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 2rem;
    box-shadow: var(--shadow-sm);
    cursor: default;
  }
  
  .hero-badge span.dot {
    width: 6px; height: 6px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
  }

  .hero h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
    background: linear-gradient(180deg, var(--text-primary) 30%, var(--text-secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p {
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--text-secondary);
    max-width: 600px;
    margin-bottom: 3rem;
    line-height: 1.7;
  }

  /* 按钮组 */
  .action-group {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.8rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    text-decoration: none;
    transition: all 0.2s;
    cursor: pointer;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background-color: var(--primary);
    color: var(--bg-surface);
    border: 1px solid var(--primary);
    box-shadow: 0 4px 14px 0 rgba(0,0,0,0.1);
  }
  .btn-primary:hover {
    background-color: var(--primary-hover);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .btn-outline {
    background-color: var(--bg-surface);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
  }
  .btn-outline:hover {
    background-color: var(--bg-hover);
    border-color: var(--text-tertiary);
  }

  /* ================= 页脚 ================= */
  .footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.85rem;
    color: var(--text-tertiary);
    border-top: 1px solid var(--border-color);
    margin-top: auto;
  }
  
  .footer a {
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }
  .footer a:hover { color: var(--text-primary); text-decoration: underline; }
</style>
</head>
<body>

  <div class="bg-glow"></div>

  <nav class="navbar">
    <div class="nav-brand">
      <!-- 书本图标 -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
      校史档案馆
    </div>
    <button id="themeToggle" class="btn-icon" title="切换主题">
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
    </button>
  </nav>

  <main class="hero">
    <div class="hero-badge">
      <span class="dot"></span>
      数据由全校师生持续共建
    </div>
    
    <h1>时光印记<br>寻找沉淀的历史碎片</h1>
    
    <p>
      每一张老照片，每一段旧故事，都是学校发展的见证。<br>
      欢迎进入校史档案馆，探索属于我们的共同记忆。
    </p>

    <div class="action-group">
      <!-- 指向子目录 /history/ -->
      <a href="/history/" class="btn btn-primary">
        进入档案馆
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
      </a>
      <!-- 指向飞书表单 -->
      <a href="https://qcnbntrwmgix.feishu.cn/share/base/form/shrcnkDQYPEUFTH1E3HEWcLcivd" target="_blank" rel="noopener" class="btn btn-outline">
        我要投稿
      </a>
    </div>
  </main>

  <footer class="footer">
    由 <a href="https://github.com/QWHistory" target="_blank" rel="noopener">QWHistory 项目组</a> 驱动 · 数据永久留存
  </footer>

<script>
  function initTheme() {
    const toggleBtn = document.getElementById("themeToggle");
    const sunIcon = document.getElementById("icon-sun");
    const moonIcon = document.getElementById("icon-moon");
    
    // 读取本地存储或系统偏好
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      sunIcon.style.display = "none"; 
      moonIcon.style.display = "block";
    }

    toggleBtn.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        sunIcon.style.display = "block"; 
        moonIcon.style.display = "none";
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        sunIcon.style.display = "none"; 
        moonIcon.style.display = "block";
      }
    });
  }

  initTheme();
</script>
</body>
</html>
