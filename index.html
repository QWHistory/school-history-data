<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校史档案馆</title>
<style>
  :root {
    --bg-body: #ffffff;
    --bg-surface: #fafafa;
    --bg-hover: #f3f4f6;
    --text-primary: #000000;
    --text-secondary: #4b5563;
    --text-tertiary: #9ca3af;
    --border-color: #e5e7eb;
    --primary: #000000;
    --primary-hover: #333333;
    --radius-md: 4px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  }

  [data-theme="dark"] {
    --bg-body: #0d1117;
    --bg-surface: #161b22;
    --bg-hover: #21262d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --border-color: #30363d;
    --primary: #f0f6fc;
    --primary-hover: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-primary);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background-color 0.2s, color 0.2s;
  }

  .navbar {
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg-body);
  }

  .nav-brand {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nav-brand .version {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.75rem;
    color: var(--text-tertiary);
    font-weight: normal;
    background: var(--bg-surface);
    padding: 0.1rem 0.4rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text-primary); }

  .btn-icon {
    background: none; border: 1px solid transparent; cursor: pointer;
    color: var(--text-secondary); padding: 0.35rem; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .btn-icon:hover { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border-color); }
  .btn-icon svg { width: 16px; height: 16px; }

  .container {
    flex: 1;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    padding: 6rem 2rem;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 4rem;
    align-items: center;
  }

  .hero-content {
    max-width: 600px;
  }

  .hero-label {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.8rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
    display: block;
  }

  .hero-content h1 {
    font-size: clamp(2.5rem, 5vw, 3.5rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
    color: var(--text-primary);
  }

  .hero-content p {
    font-size: 1.1rem;
    color: var(--text-secondary);
    margin-bottom: 3rem;
    line-height: 1.6;
    max-width: 480px;
  }

  .action-group {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: flex-start;
  }

  .action-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    border-radius: var(--radius-md);
    transition: all 0.2s;
  }

  .action-link.primary {
    background-color: var(--primary);
    color: var(--bg-body);
    border: 1px solid var(--primary);
  }
  .action-link.primary:hover {
    background-color: var(--primary-hover);
  }

  .action-link.secondary {
    background-color: transparent;
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }
  .action-link.secondary:hover {
    background-color: var(--bg-surface);
    border-color: var(--text-tertiary);
  }

  .action-link svg {
    width: 16px;
    height: 16px;
    transition: transform 0.2s;
  }
  .action-link:hover svg {
    transform: translateX(3px);
  }

  .stats-panel {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background-color: var(--bg-surface);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    box-shadow: var(--shadow-sm);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat-value {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .divider {
    height: 1px;
    background-color: var(--border-color);
    width: 100%;
  }

  .footer {
    border-top: 1px solid var(--border-color);
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-tertiary);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  @media (max-width: 768px) {
    .container {
      grid-template-columns: 1fr;
      gap: 3rem;
      padding: 4rem 1.5rem;
    }
    .navbar {
      padding: 1rem 1.5rem;
    }
    .nav-links a:not(.btn-icon) {
      display: none;
    }
    .footer {
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      text-align: center;
    }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">
      QWHistory <span class="version">v1.0</span>
    </div>
    <div class="nav-links">
      <a href="/weekly-digest/">档案库</a>
      <a href="https://qcnbntrwmgix.feishu.cn/share/base/form/shrcnkDQYPEUFTH1E3HEWcLcivd" target="_blank">贡献数据</a>
      <button id="themeToggle" class="btn-icon" title="切换主题">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </nav>

  <main class="container">
    <div class="hero-content">
      <span class="hero-label">INSTITUTIONAL ARCHIVE</span>
      <h1>校园历史<br>数字化档案库</h1>
      <p>
        本项目致力于收集、数字化并永久保存与学校历史相关的图文资料、重大事件与人物记忆。数据库面向公众开放检索。
      </p>

      <div class="action-group">
        <a href="/weekly-digest/" class="action-link primary">
          查阅全部记录
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
        </a>
        <a href="https://qcnbntrwmgix.feishu.cn/share/base/form/shrcnkDQYPEUFTH1E3HEWcLcivd" target="_blank" rel="noopener" class="action-link secondary">
          提交新档案
        </a>
      </div>
    </div>

    <div class="stats-panel">
      <div class="stat-item">
        <span class="stat-label">System Status</span>
        <span class="stat-value">ONLINE</span>
      </div>
      <div class="divider"></div>
      <div class="stat-item">
        <span class="stat-label">Data Source</span>
        <span class="stat-value">Feishu / GitHub</span>
      </div>
      <div class="divider"></div>
      <div class="stat-item">
        <span class="stat-label">Maintained By</span>
        <span class="stat-value">QWHistory Org</span>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>© 2026 QWHistory Project. All records are permanently preserved.</span>
    <span>Powered by Cloudflare Pages</span>
  </footer>

<script>
  function initTheme() {
    const toggleBtn = document.getElementById("themeToggle");
    const sunIcon = document.getElementById("icon-sun");
    const moonIcon = document.getElementById("icon-moon");

    if (localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-theme", "dark");
      sunIcon.style.display = "none";
      moonIcon.style.display = "block";
    }

    toggleBtn.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      if (isDark) {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", "light");
        sunIcon.style.display = "block";
        moonIcon.style.display = "none";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
        sunIcon.style.display = "none";
        moonIcon.style.display = "block";
      }
    });
  }

  initTheme();
</script>
</body>
</html>
