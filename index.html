<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清湾校史档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .hero { text-align: center; max-width: 800px; margin: 0 auto; padding: 4rem 1rem; }
  .hero-label { font-family: "Microsoft YaHei", sans-serif; font-size: 0.9rem; color: var(--text-tertiary); letter-spacing: 0.3em; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); display: inline-block; padding-bottom: 0.5rem; }
  .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: bold; color: var(--text-primary); margin-bottom: 1.5rem; letter-spacing: 0.1em; }
  .hero p { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 3rem; line-height: 2; }
  
  .section-title { font-size: 1.5rem; font-weight: bold; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 1rem; margin-bottom: 2rem; margin-top: 4rem; }
  
  .weekly-placeholder { background: var(--bg-surface); border: 1px dashed var(--border-color); padding: 4rem 2rem; text-align: center; color: var(--text-tertiary); font-family: "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/archive/" class="btn btn-outline">进入档案库</a>
      <a href="/submit/" class="btn btn-primary">我要投稿</a>
      <button id="themeToggle" class="btn-icon">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="hero">
        <div class="hero-label">QINGWAN INSTITUTIONAL ARCHIVE</div>
        <h1>时光印记</h1>
        <p>本项目是由学生团队自发维护的清华大学附属中学湾区学校（清湾）非官方校史资料库。我们致力于收集、数字化并永久保存与学校历史相关的图文资料与人物记忆。</p>
      </div>

      <h2 class="section-title">最新一周摘要</h2>
      <div class="weekly-placeholder">
        本周校史摘要正在编纂中，敬请期待。
      </div>
    </div>
  </main>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。<br>
    © 2026 QWHistory Project.
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  initThemeToggle();
</script>
</body>
</html>
