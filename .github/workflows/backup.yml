name: Weekly Data Backup

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Backup Archive
        run: |
          DATE=$(date +'%Y-%m-%d')
          tar -czvf backup-$DATE.tar.gz data.json images/
          echo "BACKUP_FILE=backup-$DATE.tar.gz" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ github.run_id }}
          name: 📦 数据备份 ${{ env.BACKUP_FILE }}
          body: "自动化容灾备份。包含截至今日的所有 data.json 和 images 附件。"
          files: ${{ env.BACKUP_FILE }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
