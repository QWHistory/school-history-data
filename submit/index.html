<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我要投稿 - 清湾档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .notice-box { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 2rem; margin-bottom: 2rem; border-left: 4px solid var(--primary); border-radius: 4px; }
  .notice-box h3 { color: var(--primary); margin-bottom: 1rem; font-family: "Microsoft YaHei", sans-serif; font-size: 1.1rem; }
  .notice-box ul { margin-left: 1.5rem; color: var(--text-secondary); line-height: 1.8; font-family: "Microsoft YaHei", sans-serif; font-size: 0.95rem; }
  .notice-box li { margin-bottom: 0.5rem; word-break: break-word; }
  
  /* 核心区域：控制加载状态与 iframe 显示 */
  .form-wrapper {
    position: relative;
    width: 100%;
    height: 800px; /* 表单显示时的高度 */
    border: 1px solid var(--border-color);
    background: var(--bg-surface);
    border-radius: 4px;
    overflow: hidden;
  }

  /* 加载中占位层 */
  .loading-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--bg-surface);
    z-index: 10;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .loading-text {
    font-size: 1.2rem;
    color: var(--text-tertiary);
    margin-bottom: 1rem;
  }
  .fallback-link {
    font-size: 0.9rem;
    color: var(--text-secondary);
  }
  .fallback-link a {
    color: var(--primary);
    text-decoration: underline;
  }
  .fallback-link a:hover {
    color: var(--primary-hover);
  }

  /* iframe 默认隐藏，加载成功后显示 */
  .form-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: none; /* 初始隐藏 */
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/archive/" class="btn btn-outline">进入档案库</a>
      <button id="themeToggle" class="btn-icon">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </nav>

  <main class="container">
    <div style="margin-bottom: 1.5rem;">
      <a href="/" style="color: var(--text-secondary); text-decoration: none; font-family: 'Microsoft YaHei'; font-size: 0.95rem;">&larr; 返回首页</a>
    </div>
    <h1 style="color: var(--primary); margin-bottom: 2rem; font-size: 2rem;">投稿须知</h1>
    
    <div class="notice-box">
      <h3>在提交您的珍贵记忆前，请仔细阅读：</h3>
      <ul>
        <li><strong>授权与合规：</strong>请确保您拥有所提交照片、文字的版权或合法授权。提交即代表您同意本（非官方）档案馆对其进行数字化保存及公开展示。</li>
        <li><strong>隐私保护：</strong>请勿上传涉及他人隐私（如身份证号、家庭住址等）的敏感信息。</li>
        <li><strong>审核流程：</strong>提交后，所有档案将由学生史官团队进行人工审核。审核通过后，通常在 1-2 天内展示在档案库中。</li>
      </ul>
    </div>

    <!-- 表单区域 -->
    <div class="form-wrapper">
      <!-- 占位提示层 -->
      <div class="loading-placeholder" id="loadingPlaceholder">
        <div class="loading-text">表单加载中，请稍候...</div>
        <div class="fallback-link">
          无法显示？请 <a href="https://qcnbntrwmgix.feishu.cn/share/base/form/shrcnkDQYPEUFTH1E3HEWcLcivd" target="_blank" rel="noopener">点击此处在新标签页打开</a>
        </div>
      </div>

      <!-- 真实的 iframe -->
      <iframe id="feishuForm" src="https://qcnbntrwmgix.feishu.cn/share/base/form/shrcnkDQYPEUFTH1E3HEWcLcivd"></iframe>
    </div>

  </main>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  initThemeToggle();

  const iframe = document.getElementById('feishuForm');
  const loadingPlaceholder = document.getElementById('loadingPlaceholder');

  // 当 iframe 加载完成时，隐藏提示层，展示 iframe
  iframe.onload = function() {
    loadingPlaceholder.style.display = 'none';
    iframe.style.display = 'block';
  };
</script>
</body>
</html>
