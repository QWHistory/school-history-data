<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案详情 - 校史档案馆</title>
<style>
  :root {
    --bg-body: #ffffff; --bg-surface: #fafafa; --text-primary: #222222; --text-secondary: #555555; --text-tertiary: #888888;
    --border-color: #e0e0e0; --primary: #4a0254; --primary-hover: #36013d;
  }
  [data-theme="dark"] {
    --bg-body: #121212; --bg-surface: #1e1e1e; --text-primary: #f0f0f0; --text-secondary: #aaaaaa; --text-tertiary: #777777;
    --border-color: #333333; --primary: #b47dbd; --primary-hover: #cfa3d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Songti SC", "SimSun", "Georgia", serif; background-color: var(--bg-body); color: var(--text-primary); line-height: 1.6; padding-bottom: 4rem; min-height: 100vh; }
  body.modal-open { overflow: hidden; }
  
  .navbar { border-bottom: 2px solid var(--primary); padding: 1.5rem 2rem; background: var(--bg-body); display: flex; justify-content: space-between; align-items: center; }
  .back-btn { display: flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); text-decoration: none; font-size: 1rem; cursor: pointer; font-family: "Microsoft YaHei", sans-serif; }
  .back-btn:hover { color: var(--primary); }
  .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 0.5rem; transition: color 0.2s; }
  .btn-icon:hover { color: var(--primary); }
  .btn-icon svg { width: 20px; height: 20px; }

  .container { max-width: 860px; margin: 4rem auto; padding: 0 2rem; }
  
  .header-section { margin-bottom: 3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem; text-align: center; }
  .header-tag { display: inline-block; color: var(--primary); border: 1px solid var(--primary); padding: 0.1rem 0.8rem; font-size: 0.85rem; margin-bottom: 1.5rem; font-family: "Microsoft YaHei", sans-serif; }
  .header-title { font-size: 2.8rem; font-weight: bold; line-height: 1.4; color: var(--text-primary); margin-bottom: 2rem; letter-spacing: 0.05em; word-break: break-all; }
  
  .meta-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5rem 3rem; font-size: 0.95rem; color: var(--text-tertiary); font-family: "Microsoft YaHei", sans-serif; }
  .meta-item { display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
  .meta-value { color: var(--text-secondary); }
  .uid-badge { font-family: "Courier New", monospace; color: var(--text-primary); font-weight: bold; }
  .meta-item svg { width: 16px; height: 16px; }
  
  .content-section { font-size: 1.15rem; line-height: 2.2; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; margin-bottom: 4rem; text-align: justify; }
  
  .attachments-section { margin-bottom: 4rem; font-family: "Microsoft YaHei", sans-serif; }
  .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 1.5rem; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; display: inline-block; }
  .attachment-grid { display: flex; flex-direction: column; gap: 1rem; }
  .attachment-item { display: flex; align-items: center; gap: 0.8rem; padding: 1rem; background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-primary); text-decoration: none; transition: all 0.2s; }
  .attachment-item:hover { border-color: var(--primary); color: var(--primary); }
  .attachment-item svg { width: 20px; height: 20px; }

  .footer-section { display: flex; justify-content: space-between; align-items: center; padding-top: 2rem; border-top: 1px solid var(--border-color); font-family: "Microsoft YaHei", sans-serif; flex-wrap: wrap; gap: 1rem; }
  .btn-report { background: none; border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; white-space: nowrap; }
  .btn-report:hover { color: #d32f2f; border-color: #d32f2f; }

  .loading-state { text-align: center; padding: 6rem 0; color: var(--text-tertiary); font-family: "Microsoft YaHei", sans-serif; }
  .error-state { text-align: center; padding: 6rem 0; font-family: "Microsoft YaHei", sans-serif; }
  .error-state h2 { font-size: 2rem; margin-bottom: 1rem; }
  .error-state p { color: var(--text-secondary); margin-bottom: 2rem; }
  .btn-primary { background: var(--primary); color: #fff; text-decoration: none; padding: 0.8rem 2rem; font-weight: 500; display: inline-block; }

  .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
  .lightbox-overlay.active { opacity: 1; visibility: visible; }
  .lightbox-img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
  .lightbox-close { position: absolute; top: 30px; right: 30px; background: none; border: none; color: #fff; cursor: pointer; }
  .lightbox-close svg { width: 30px; height: 30px; }
  
  @media (max-width: 768px) {
    .header-title { font-size: 2rem; }
    .meta-grid { flex-direction: column; gap: 1rem; align-items: flex-start; text-align: left; }
    .container { margin: 2rem auto; padding: 0 1.5rem; }
    .footer-section { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/weekly-digest/" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      返回列表
    </a>
    <button id="themeToggle" class="btn-icon">
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
    </button>
  </nav>

  <main class="container" id="mainContent">
    <div class="loading-state">正在检索档案数据...</div>
  </main>

  <div class="lightbox-overlay" id="imageLightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox(event)">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>
    <img id="lightboxImg" class="lightbox-img" src="">
  </div>

<script>
  const DATA_URL = '/data.json';
  const CDN_PREFIX = '/';

  const SVG_ICONS = {
    user: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>`,
    users: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>`,
    clock: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
    image: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`,
    doc: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>`,
    archive: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>`,
    warning: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`
  };

  function getFileIcon(path) { const ext = (path.split('.').pop() || '').toLowerCase(); if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return SVG_ICONS.image; if (['zip','rar','7z'].includes(ext)) return SVG_ICONS.archive; return SVG_ICONS.doc; }
  function isImageFile(path) { return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(path); }
  function getDisplayFileName(path) { return (path.split('/').pop() || path).replace(/^rec[a-zA-Z0-9]+_/, ''); }
  function extractPlainText(value) {
    if (!value) return '';
    if (typeof value === 'string') return value.trim();
    if (Array.isArray(value)) return value.map(item => (item && item.type === 'text' ? item.text : (item.name || ''))).join('').trim();
    if (value && value.text) return value.text.trim();
    return String(value).trim();
  }
  function escapeHTML(str) { if (!str) return ''; return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }
  function formatTimeRange(startTs, endTs, fallbackTs) {
    const fmt = (ts) => { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const s = fmt(startTs), e = fmt(endTs); if (s && e && s !== e) return `${s} 至 ${e}`; return s || e || fmt(fallbackTs);
  }
  function generateReportLink(uid) {
    const email = '1077401836@qq.com'; const subject = encodeURIComponent(`[校史档案举报] 发现违规内容 - UID: ${uid}`); const body = encodeURIComponent(`您好，\n\n我认为该档案（UID: ${uid}）存在侵权或违规问题，请核实处理。\n\n补充说明：`); return `mailto:${email}?subject=${subject}&body=${body}`;
  }
  function openLightbox(src) { const lb = document.getElementById('imageLightbox'); document.getElementById('lightboxImg').src = src; lb.classList.add('active'); document.body.classList.add('modal-open'); }
  function closeLightbox(event) { if (event) event.stopPropagation(); document.getElementById('imageLightbox').classList.remove('active'); document.body.classList.remove('modal-open'); }

  function initThemeToggle() {
    const toggleBtn = document.getElementById('themeToggle'), sunIcon = document.getElementById('icon-sun'), moonIcon = document.getElementById('icon-moon');
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.setAttribute('data-theme', 'dark'); sunIcon.style.display = 'none'; moonIcon.style.display = 'block'; }
    toggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); sunIcon.style.display = 'block'; moonIcon.style.display = 'none'; }
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); sunIcon.style.display = 'none'; moonIcon.style.display = 'block'; }
    });
  }

  async function initPage() {
    initThemeToggle();
    const container = document.getElementById('mainContent');
    
    const path = window.location.pathname;
    let targetUid = '';
    
    if (path.includes('/record/')) {
      targetUid = path.split('/record/')[1].replace(/\/$/, '');
      targetUid = decodeURIComponent(targetUid).trim();
    }

    if (!targetUid) { render404(container, "路径错误", "未提供有效的档案编号。请从列表中点击进入。"); return; }

    try {
      const response = await fetch(DATA_URL);
      if (!response.ok) throw new Error('Network error');
      const allRecords = await response.json();
      const record = allRecords.find(r => extractPlainText(r['UID']).trim() === targetUid);

      if (!record) { render404(container, "未找到档案", `未找到编号为 ${targetUid} 的校史档案。`); return; }
      renderDetail(container, record);
    } catch (error) { render404(container, "数据加载失败", "请检查网络连接或稍后再试。"); }
  }

  function render404(container, title, msg) {
    container.innerHTML = `<div class="error-state"><h2>${escapeHTML(title)}</h2><p>${escapeHTML(msg)}</p><a href="/weekly-digest/" class="btn-primary">返回列表</a></div>`;
  }

  function renderDetail(container, record) {
    const category = extractPlainText(record['分区']), title = extractPlainText(record['内容标题']) || '无标题档案';
    const uid = extractPlainText(record['UID']), related = extractPlainText(record['内容主要参与人']);
    const timeRange = formatTimeRange(record['开始时间'], record['结束时间'], record['投稿时间']);
    const body = extractPlainText(record['内容详述']), contributor = extractPlainText(record['投稿人昵称']);
    document.title = `${title} - 校史档案馆`;

    let html = `<div class="header-section">`;
    if (category) html += `<span class="header-tag">${escapeHTML(category)}</span>`;
    html += `<h1 class="header-title">${escapeHTML(title)}</h1>`;
    
    html += `<div class="meta-grid">`;
    html += `<div class="meta-item"><span class="uid-badge">唯一编号: ${escapeHTML(uid)}</span></div>`;
    if (timeRange) html += `<div class="meta-item">${SVG_ICONS.clock} <span class="meta-value">${escapeHTML(timeRange)}</span></div>`;
    if (contributor) html += `<div class="meta-item">${SVG_ICONS.user} 贡献者: <span class="meta-value">${escapeHTML(contributor)}</span></div>`;
    if (related) html += `<div class="meta-item">${SVG_ICONS.users} 有关人: <span class="meta-value">${escapeHTML(related)}</span></div>`;
    html += `</div></div>`;
    
    if (body) html += `<div class="content-section">${escapeHTML(body)}</div>`;

    const attachments = record['attachments'] || [];
    if (attachments.length > 0) {
      html += `<div class="attachments-section"><div class="section-title">相关附件</div><div class="attachment-grid">`;
      attachments.forEach(filePath => {
        const href = CDN_PREFIX + filePath.replace(/^\//, ''), displayName = escapeHTML(getDisplayFileName(filePath));
        if (isImageFile(filePath)) html += `<a class="attachment-item" href="javascript:void(0)" onclick="event.preventDefault(); openLightbox('${href}')">${getFileIcon(filePath)} <span class="attachment-name">${displayName}</span></a>`;
        else html += `<a class="attachment-item" href="${href}" target="_blank" rel="noopener" download="${getDisplayFileName(filePath)}">${getFileIcon(filePath)} <span class="attachment-name">${displayName}</span></a>`;
      });
      html += `</div></div>`;
    }
    html += `<div class="footer-section"><span style="font-size: 0.9rem; color: var(--text-tertiary);">本页面链接可直接分享</span><a class="btn-report" href="${generateReportLink(uid)}">${SVG_ICONS.warning} 举报违规内容</a></div>`;
    container.innerHTML = html;
  }

  initPage();
</script>
</body>
</html>
