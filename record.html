<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案详情 - 清湾档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  main { padding-top: 4rem; padding-bottom: 6rem; max-width: 860px; margin: 0 auto; padding-left: 3rem; padding-right: 3rem; width: 100%; }
  .detail-header { text-align: center; margin-bottom: 3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem; }
  .detail-title { font-size: 2.5rem; color: var(--text-primary); margin-bottom: 1.5rem; word-break: break-all; }
  .detail-meta { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; font-family: 'Microsoft YaHei'; font-size: 0.95rem; color: var(--text-tertiary); }
  .detail-body { font-size: 1.15rem; line-height: 2.2; text-align: justify; margin-bottom: 4rem; white-space: pre-wrap; }
  .detail-attachments { margin-bottom: 4rem; font-family: 'Microsoft YaHei'; }
  .section-title { font-size: 1.2rem; font-weight: bold; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; display: inline-block; margin-bottom: 1.5rem; }
  .detail-attachments-list { display: flex; flex-direction: column; gap: 1rem; }
  .detail-attachments-list a { display: flex; align-items: center; gap: 0.8rem; padding: 1rem; background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-primary); text-decoration: none; }
  .detail-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 2rem; border-top: 1px solid var(--border-color); font-family: 'Microsoft YaHei'; }
  .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 2rem; font-size: 0.95rem; font-family: 'Microsoft YaHei'; }
  .back-btn:hover { color: var(--primary); }
  .back-btn svg { width: 16px; height: 16px; }
  .empty { text-align: center; padding: 6rem 0; color: var(--text-tertiary); }
  @media (max-width: 768px) {
    main { padding: 2rem 1.5rem 4rem 1.5rem; }
    .detail-title { font-size: 1.8rem; }
    .detail-meta { flex-direction: column; gap: 1rem; align-items: center; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/submit/" class="btn btn-outline">我要投稿</a>
      <button id="themeToggle" class="btn-icon">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </nav>

  <main id="mainContent">
    <div class="empty">加载中...</div>
  </main>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  const DATA_URL = '/data.json';
  const CDN_PREFIX = '/';

  const SVG_ICONS = {
    user: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>`,
    users: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>`,
    clock: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
    image: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`,
    doc: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>`,
    archive: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>`,
    warning: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`
  };
  function getFileIcon(path) { const ext = (path.split('.').pop() || '').toLowerCase(); if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return SVG_ICONS.image; if (['zip','rar','7z'].includes(ext)) return SVG_ICONS.archive; return SVG_ICONS.doc; }
  function getDisplayFileName(path) { return (path.split('/').pop() || path).replace(/^rec[a-zA-Z0-9]+_/, ''); }

  async function init() {
    initThemeToggle();
    const container = document.getElementById('mainContent');
    // 提取 /record/123 里的 123
    let targetUid = window.location.pathname.replace(/\/$/, '').split('/').pop().replace('.html', '');
    if (targetUid === 'record') targetUid = ''; // 排除纯 /record

    if (!targetUid) { container.innerHTML = `<div class="empty">未提供有效编号。<a href="/archive/" style="color:var(--primary);">返回列表</a></div>`; return; }

    try {
      const res = await fetch(DATA_URL);
      const allRecords = await res.json();
      const record = allRecords.find(r => extractPlainText(r['UID']).trim() === targetUid);

      if (!record) { container.innerHTML = `<div class="empty">未找到编号为 ${targetUid} 的档案。<a href="/archive/" style="color:var(--primary);">返回列表</a></div>`; return; }
      
      const category = extractPlainText(record['分区']), title = extractPlainText(record['内容标题']) || '无标题';
      const uid = extractPlainText(record['UID']), related = extractPlainText(record['内容主要参与人']);
      const timeRange = formatTimeRange(record['开始时间'], record['结束时间'], record['投稿时间']);
      const body = extractPlainText(record['内容详述']), contributor = extractPlainText(record['投稿人昵称']);
      document.title = `${title} - 清湾档案馆`;

      let html = `<a href="/archive/" class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg> 返回档案库</a>`;
      
      html += `<div class="detail-header">`;
      if (category) html += `<span class="tag" style="margin-bottom:1rem; display:inline-block;">${escapeHTML(category)}</span>`;
      html += `<h1 class="detail-title">${escapeHTML(title)}</h1>`;
      html += `<div class="detail-meta">`;
      html += `<span class="uid-badge">编号: ${escapeHTML(uid)}</span>`;
      if (timeRange) html += `<span>${SVG_ICONS.clock} ${escapeHTML(timeRange)}</span>`;
      if (related) html += `<span>${SVG_ICONS.users} 有关人: ${escapeHTML(related)}</span>`;
      if (contributor) html += `<span>${SVG_ICONS.user} 贡献者: ${escapeHTML(contributor)}</span>`;
      html += `</div></div>`;

      html += `<div class="detail-body">${escapeHTML(body || '暂无详细内容')}</div>`;

      const attachments = record['attachments'] || [];
      if (attachments.length > 0) {
        html += `<div class="detail-attachments"><div class="section-title">相关附件</div><div class="detail-attachments-list">`;
        attachments.forEach(p => {
          const href = CDN_PREFIX + p.replace(/^\//, ''), name = escapeHTML(getDisplayFileName(p));
          html += `<a href="${href}" target="_blank" rel="noopener">${getFileIcon(p)} ${name}</a>`;
        });
        html += `</div></div>`;
      }
      html += `<div class="detail-footer"><span style="font-size:0.9rem; color:var(--text-tertiary);">本页面链接可直接分享</span><a class="btn-report" href="${generateReportLink(uid)}" style="border:1px solid var(--border-color); padding:0.6rem 1.2rem; color:var(--text-secondary); text-decoration:none; display:flex; gap:0.5rem;">${SVG_ICONS.warning} 举报</a></div>`;
      
      container.innerHTML = html;
    } catch (e) { container.innerHTML = `<div class="empty">加载失败</div>`; }
  }
  init();
</script>
</body>
</html>
