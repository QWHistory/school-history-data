<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案详情 - 清湾档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/archive/" class="btn btn-outline">返回档案库</a>
    </div>
  </nav>

  <main class="main-container" id="mainContent">
    <div style="text-align:center; padding: 4rem;">正在加载...</div>
  </main>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  const DATA_URL = '/data.json';

  async function loadData() {
    const container = document.getElementById('mainContent');
    
    // 提取 /record/123 里面的 123
    const parts = window.location.pathname.split('/');
    let targetUid = parts.pop() || parts.pop(); 
    // 如果是 /record/ 结尾，就取前一个
    if (targetUid === 'record') {
      container.innerHTML = '<div style="text-align:center;">请从列表点击进入</div>';
      return;
    }

    try {
      const res = await fetch(DATA_URL);
      const records = await res.json();
      const record = records.find(r => extractPlainText(r['UID']) === targetUid);

      if (!record) {
        container.innerHTML = `<div style="text-align:center;">找不到该档案</div>`;
        return;
      }

      const title = extractPlainText(record['内容标题']) || '无标题';
      const body = extractPlainText(record['内容详述']);
      const uid = extractPlainText(record['UID']);
      
      container.innerHTML = `
        <h1 style="font-size: 2rem; margin-bottom: 1rem;">${escapeHTML(title)}</h1>
        <div style="color: #666; margin-bottom: 2rem;">编号: ${escapeHTML(uid)}</div>
        <div style="white-space: pre-wrap; line-height: 2;">${escapeHTML(body)}</div>
      `;
    } catch (e) {
      container.innerHTML = '<div style="text-align:center;">加载失败</div>';
    }
  }
  loadData();
</script>
</body>
</html>
