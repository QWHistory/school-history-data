<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校史档案库 - 清湾档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/submit/" class="btn btn-outline">我要投稿</a>
    </div>
  </nav>

  <main class="main-container">
    <div id="list" class="card-list"></div>
  </main>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  // 仅用于加载数据并渲染最基础的卡片
  const DATA_URL = '/data.json';
  
  async function loadData() {
    try {
      const res = await fetch(DATA_URL);
      const records = await res.json();
      const list = document.getElementById('list');
      
      if (!records || records.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding: 4rem;">暂无记录</div>';
        return;
      }

      records.forEach(record => {
        const title = extractPlainText(record['内容标题']) || '无标题';
        const uid = extractPlainText(record['UID']) || '无';
        const body = extractPlainText(record['内容详述']);
        const contributor = extractPlainText(record['投稿人昵称']);
        const date = formatTimeRange(record['开始时间'], record['结束时间'], record['投稿时间']);
        
        // 只用最原生的 a 标签
        const html = `
          <a href="/record/${uid}" style="text-decoration:none; color:inherit; display:block;">
            <div class="card">
              <div class="card-date">${date.substring(0, 10)}</div>
              <div class="card-content">
                <div class="card-title">${escapeHTML(title)}</div>
                <div class="card-meta"><span>编号: ${escapeHTML(uid)}</span></div>
                ${body ? `<div class="card-body">${escapeHTML(body)}</div>` : ''}
                <div class="card-footer">
                  <span>${contributor ? '贡献者: ' + escapeHTML(contributor) : ''}</span>
                </div>
              </div>
            </div>
          </a>
        `;
        list.insertAdjacentHTML('beforeend', html);
      });
    } catch (e) {
      document.getElementById('list').innerHTML = '<div style="text-align:center;">加载失败</div>';
    }
  }
  loadData();
</script>
</body>
</html>
