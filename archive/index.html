<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校史档案库 - 清湾档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  /* 搜索工具栏 */
  .toolbar { display: flex; flex-direction: column; gap: 1.2rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; }
  .search-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
  .search-wrapper svg { position: absolute; left: 1rem; width: 18px; height: 18px; color: var(--text-tertiary); }
  .search-input { width: 100%; height: 46px; padding: 0 1rem 0 3rem; border: 1px solid var(--border-color); font-size: 0.95rem; background: var(--bg-body); color: var(--text-primary); font-family: inherit; }
  .search-input:focus { outline: none; border-color: var(--primary); }
  
  .filter-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .filter-select { flex: 1; min-width: 120px; height: 46px; padding: 0 1rem; border: 1px solid var(--border-color); font-size: 0.9rem; background-color: var(--bg-body); color: var(--text-primary); }
  .date-group { display: flex; align-items: center; gap: 0.5rem; flex: 2; min-width: 250px; }
  .date-input { flex: 1; height: 46px; padding: 0 1rem; border: 1px solid var(--border-color); font-size: 0.9rem; background: var(--bg-body); color: var(--text-primary); font-family: inherit; }

  .tag { display: inline-block; color: var(--primary); padding: 0.1rem 0.4rem; font-size: 0.75rem; border: 1px solid var(--primary); font-family: "Microsoft YaHei", sans-serif; margin-left: 0.5rem; vertical-align: middle; }
  
  @media (max-width: 768px) {
    .entry-item { flex-direction: column; gap: 0.5rem; padding: 1.5rem 0; }
    .entry-date { width: 100%; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/submit/" class="btn btn-outline">我要投稿</a>
      <button id="themeToggle" class="btn-icon">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </nav>

  <!-- 强制使用通用居中容器 -->
  <div class="container">
    <div class="toolbar">
      <div class="search-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索标题、正文或编号...">
      </div>
      <div class="filter-row">
        <select id="categorySelect" class="filter-select"><option value="全部">全部分类</option></select>
        <select id="relatedSelect" class="filter-select"><option value="全部">全部有关者</option></select>
        <div class="date-group">
          <input type="date" id="startDate" class="date-input">
          <span style="color:var(--text-tertiary);">至</span>
          <input type="date" id="endDate" class="date-input">
        </div>
        <select id="attachmentSelect" class="filter-select">
          <option value="全部">全部附件</option>
          <option value="图片">包含图片</option>
          <option value="文档">包含文档</option>
          <option value="无">无附件</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  const DATA_URL = '/data.json';
  let allRecords = [], filteredRecords = [];
  let searchQuery = '', activeCategory = '全部', activeRelated = '全部', startDateFilter = '', endDateFilter = '', activeAttachmentType = '全部';

  function getRecordTimeRange(record) {
    const times = []; if (record['开始时间']) times.push(record['开始时间']); if (record['结束时间']) times.push(record['结束时间']); if (times.length === 0 && record['投稿时间']) times.push(record['投稿时间']);
    return times.length === 0 ? null : [Math.min(...times), Math.max(...times)];
  }
  function getAttachmentCategory(record) {
    const atts = record['attachments'] || []; if (atts.length === 0) return '无';
    let hasImg = false, hasDoc = false;
    atts.forEach(p => (/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(p) ? (hasImg = true) : (hasDoc = true)));
    return hasImg && hasDoc ? '图文混合' : (hasImg ? '图片' : '文档');
  }

  function buildCardHTML(record) {
    const title = extractPlainText(record['内容标题']) || '无标题';
    const uid = extractPlainText(record['UID']) || '无';
    const related = extractPlainText(record['内容主要参与人']);
    const category = extractPlainText(record['分区']);
    const body = extractPlainText(record['内容详述']);
    const timeRange = formatTimeRange(record['开始时间'], record['结束时间'], record['投稿时间']);
    
    let dateStr = timeRange || '';
    if(dateStr.includes(' 至 ')) dateStr = dateStr.split(' 至 ')[0].substring(0, 4);
    else if(dateStr.length >= 10) dateStr = dateStr.substring(0, 10);

    return `
      <div class="entry-item" onclick="window.location.href='/record/${uid}'">
        <div class="entry-date">${escapeHTML(dateStr)}</div>
        <div class="entry-content">
          <div class="entry-title">${escapeHTML(title)} ${category ? `<span class="tag">${escapeHTML(category)}</span>` : ''}</div>
          <div class="entry-meta">
            <span>编号: ${escapeHTML(uid)}</span>
            ${related ? `<span>有关人: ${escapeHTML(related)}</span>` : ''}
          </div>
          ${body ? `<div class="entry-desc">${escapeHTML(body)}</div>` : ''}
        </div>
      </div>
    `;
  }

  function renderRecordList() {
    const listContainer = document.getElementById('list');
    if (filteredRecords.length === 0) { listContainer.innerHTML = `<div style="text-align:center; padding: 4rem 0; color:var(--text-tertiary);">暂无记录</div>`; return; }
    listContainer.innerHTML = filteredRecords.map(buildCardHTML).join('');
  }

  function applyFilters() {
    filteredRecords = allRecords.filter(record => {
      const categoryMatch = activeCategory === '全部' || extractPlainText(record['分区']) === activeCategory;
      const relatedMatch = activeRelated === '全部' || extractPlainText(record['内容主要参与人']) === activeRelated;
      let timeMatch = true;
      if (startDateFilter || endDateFilter) {
        const rt = getRecordTimeRange(record);
        if (!rt) timeMatch = false;
        else { const fs = startDateFilter ? new Date(startDateFilter).getTime() : 0; const fe = endDateFilter ? new Date(endDateFilter).getTime() + 86399000 : Infinity; if (rt[1] < fs || rt[0] > fe) timeMatch = false; }
      }
      let attachmentMatch = true;
      if (activeAttachmentType !== '全部') { const ac = getAttachmentCategory(record); if (activeAttachmentType === '图片') attachmentMatch = ac.includes('图片'); else if (activeAttachmentType === '文档') attachmentMatch = ac.includes('文档'); else if (activeAttachmentType === '无') attachmentMatch = ac === '无'; }
      const q = searchQuery.toLowerCase();
      const textMatch = !q || extractPlainText(record['内容标题']).toLowerCase().includes(q) || extractPlainText(record['内容详述']).toLowerCase().includes(q) || extractPlainText(record['投稿人昵称']).toLowerCase().includes(q) || extractPlainText(record['内容主要参与人']).toLowerCase().includes(q) || extractPlainText(record['UID']).toLowerCase().includes(q);
      return categoryMatch && relatedMatch && timeMatch && attachmentMatch && textMatch;
    });
    filteredRecords.sort((a, b) => (b['开始时间'] || b['投稿时间'] || 0) - (a['开始时间'] || a['投稿时间'] || 0));
    renderRecordList();
  }

  async function loadData() {
    initThemeToggle();
    try {
      const res = await fetch(DATA_URL);
      allRecords = await res.json();
      
      const catSelect = document.getElementById('categorySelect'), relSelect = document.getElementById('relatedSelect');
      [...new Set(allRecords.map(r => extractPlainText(r['分区'])).filter(Boolean))].forEach(c => catSelect.innerHTML += `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`);
      [...new Set(allRecords.map(r => extractPlainText(r['内容主要参与人'])).filter(Boolean))].forEach(r => relSelect.innerHTML += `<option value="${escapeHTML(r)}">${escapeHTML(r)}</option>`);
      
      catSelect.onchange = (e) => { activeCategory = e.target.value; applyFilters(); };
      relSelect.onchange = (e) => { activeRelated = e.target.value; applyFilters(); };
      document.getElementById('startDate').onchange = (e) => { startDateFilter = e.target.value; applyFilters(); };
      document.getElementById('endDate').onchange = (e) => { endDateFilter = e.target.value; applyFilters(); };
      document.getElementById('attachmentSelect').onchange = (e) => { activeAttachmentType = e.target.value; applyFilters(); };
      
      let st = null;
      document.getElementById('searchInput').oninput = (e) => { searchQuery = e.target.value.trim(); clearTimeout(st); st = setTimeout(() => applyFilters(), 300); };
      
      applyFilters();
    } catch (err) { document.getElementById('list').innerHTML = `<div style="text-align:center;">数据加载失败。</div>`; }
  }
  loadData();
</script>
</body>
</html>
