<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校史档案库 - 清湾档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  /* 强制撑开顶部 */
  main { padding-top: 4rem; padding-bottom: 6rem; max-width: 1140px; margin: 0 auto; padding-left: 3rem; padding-right: 3rem; width: 100%; }
  
  .toolbar { display: flex; flex-direction: column; gap: 1.2rem; margin-bottom: 3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem; }
  .search-row { display: flex; gap: 1rem; align-items: center; }
  .search-wrapper { position: relative; display: flex; align-items: center; flex: 1; }
  .search-wrapper svg { position: absolute; left: 1.2rem; width: 18px; height: 18px; color: var(--text-tertiary); }
  .search-input { width: 100%; height: 48px; padding: 0 1rem 0 3.5rem; border: 1px solid var(--border-color); font-size: 1rem; background: var(--bg-body); color: var(--text-primary); font-family: inherit; }
  .search-input:focus { outline: none; border-color: var(--primary); }
  .btn-reset-all { display: none; height: 48px; padding: 0 1.5rem; background: var(--bg-surface); border: 1px solid var(--border-color); font-size: 0.95rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
  .btn-reset-all:hover { border-color: var(--primary); color: var(--primary); }

  .filter-row { display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr; gap: 1rem; align-items: center; width: 100%; font-family: "Microsoft YaHei", sans-serif; }
  .filter-select { width: 100%; height: 48px; padding: 0 1rem; border: 1px solid var(--border-color); font-size: 0.95rem; background-color: var(--bg-body); color: var(--text-primary); cursor: pointer; }
  .date-range-group { display: flex; align-items: center; gap: 0.5rem; width: 100%; }
  .date-input { flex: 1; height: 48px; padding: 0 1rem; border: 1px solid var(--border-color); font-size: 0.95rem; background: var(--bg-body); color: var(--text-primary); font-family: inherit; }

  /* 网格布局绝对统一间距 */
  .entry { 
    display: grid; grid-template-columns: 100px 1fr; gap: 2rem; 
    border-bottom: 1px solid var(--border-color); padding: 2.5rem 0; 
    cursor: pointer; transition: background 0.2s;
  }
  .entry:hover { background-color: var(--bg-surface); }
  .entry:hover .entry-title { color: var(--primary); }
  .entry-date-col { color: var(--text-tertiary); font-family: "Courier New", monospace; font-size: 1.1rem; margin-top: 0.2rem; }
  .entry-content-col { display: flex; flex-direction: column; min-width: 0; }
  .entry-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
  .entry-title { font-size: 1.4rem; font-weight: bold; color: var(--text-primary); font-family: "Microsoft YaHei", sans-serif; word-break: break-word; transition: color 0.2s; }
  .tag { color: var(--primary); padding: 0.15rem 0.6rem; font-size: 0.8rem; border: 1px solid var(--primary); font-family: "Microsoft YaHei", sans-serif; }
  .entry-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem; font-family: "Microsoft YaHei", sans-serif; }
  .meta-item { display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
  .uid-badge { font-family: "Courier New", monospace; font-size: 0.85rem; }
  .entry-body { white-space: pre-wrap; font-size: 1rem; color: var(--text-secondary); margin-bottom: 1.2rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.7; }
  .attachment-grid { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.2rem; font-family: "Microsoft YaHei", sans-serif; }
  .attachment-item { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--primary); text-decoration: none; }
  .attachment-item:hover { text-decoration: underline; }
  .attachment-item svg { width: 16px; height: 16px; }
  .entry-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-family: "Microsoft YaHei", sans-serif; margin-top: auto; }
  .footer-contributor { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--text-tertiary); }
  .btn-action.report { background: none; border: none; font-size: 0.85rem; color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
  .btn-action.report:hover { color: #d32f2f; }
  .empty { text-align: center; padding: 6rem 1rem; color: var(--text-tertiary); font-size: 1.1rem; }

  @media (max-width: 768px) { 
    main { padding: 2rem 1.5rem 4rem 1.5rem; }
    .filter-row { grid-template-columns: 1fr; } 
    .entry { grid-template-columns: 1fr; gap: 0.5rem; padding: 1.5rem 0; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/submit/" class="btn btn-outline">我要投稿</a>
      <button id="themeToggle" class="btn-icon">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </nav>

  <main>
    <div class="toolbar">
      <div class="search-row">
        <div class="search-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="搜索档案标题、正文或编号...">
        </div>
        <button class="btn-reset-all" id="resetAllBtn">重置</button>
      </div>
      <div class="filter-row">
        <select id="categorySelect" class="filter-select"><option value="全部">全部分类</option></select>
        <select id="relatedSelect" class="filter-select"><option value="全部">全部有关者</option></select>
        <div class="date-range-group">
          <input type="date" id="startDate" class="date-input">
          <span style="color: var(--text-tertiary);">至</span>
          <input type="date" id="endDate" class="date-input">
        </div>
        <select id="attachmentSelect" class="filter-select">
          <option value="全部">全部附件</option>
          <option value="图片">包含图片</option>
          <option value="文档">包含文档</option>
          <option value="无">无附件</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
  </main>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  const DATA_URL = '/data.json';
  const CDN_PREFIX = '/';
  let allRecords = [], filteredRecords = [];
  let searchQuery = '', activeCategory = '全部', activeRelated = '全部', startDateFilter = '', endDateFilter = '', activeAttachmentType = '全部';

  const SVG_ICONS = {
    user: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>`,
    users: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>`,
    image: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>`,
    doc: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>`,
    archive: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>`,
    warning: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`
  };

  function getFileIcon(path) { const ext = (path.split('.').pop() || '').toLowerCase(); if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return SVG_ICONS.image; if (['zip','rar','7z'].includes(ext)) return SVG_ICONS.archive; return SVG_ICONS.doc; }
  function isImageFile(path) { return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(path); }
  function getDisplayFileName(path) { return (path.split('/').pop() || path).replace(/^rec[a-zA-Z0-9]+_/, ''); }
  
  function getRecordTimeRange(record) {
    const times = []; if (record['开始时间']) times.push(record['开始时间']); if (record['结束时间']) times.push(record['结束时间']); if (times.length === 0 && record['投稿时间']) times.push(record['投稿时间']);
    return times.length === 0 ? null : [Math.min(...times), Math.max(...times)];
  }
  function getAttachmentCategory(record) {
    const atts = record['attachments'] || []; if (atts.length === 0) return '无'; let hasImg = false, hasDoc = false;
    atts.forEach(p => (isImageFile(p) ? (hasImg = true) : (hasDoc = true))); return hasImg && hasDoc ? '图文混合' : (hasImg ? '图片' : '文档');
  }

  function buildCardHTML(record) {
    const category = extractPlainText(record['分区']), title = extractPlainText(record['内容标题']), uid = extractPlainText(record['UID']) || '无', relatedPeople = extractPlainText(record['内容主要参与人']), timeRange = formatTimeRange(record['开始时间'], record['结束时间'], record['投稿时间']), body = extractPlainText(record['内容详述']), contributor = extractPlainText(record['投稿人昵称']);
    let dateStr = timeRange || '';
    if(dateStr.includes(' 至 ')) dateStr = dateStr.split(' 至 ')[0].substring(0, 4);
    else if(dateStr.length >= 10) dateStr = dateStr.substring(0, 10);
    
    let html = `<a class="entry" href="/record/${uid}" style="color:inherit; text-decoration:none;">`;
    html += `<div class="entry-date-col">${escapeHTML(dateStr)}</div>`;
    html += `<div class="entry-content-col">`;
    html += `<div class="entry-header">`;
    if (title) html += `<div class="entry-title">${escapeHTML(title)}</div>`;
    if (category) html += `<span class="tag">${escapeHTML(category)}</span>`;
    html += `</div><div class="entry-meta">`;
    html += `<span class="meta-item uid-badge">编号: ${escapeHTML(uid)}</span>`;
    if (relatedPeople) html += `<span class="meta-item">${SVG_ICONS.users} 有关人: <span style="color:var(--text-primary)">${escapeHTML(relatedPeople)}</span></span>`;
    html += `</div>`;
    if (body) html += `<div class="entry-body">${escapeHTML(body)}</div>`;
    const attachments = record['attachments'] || [];
    if (attachments.length > 0) {
      html += `<div class="attachment-grid">`;
      attachments.forEach(filePath => {
        const href = CDN_PREFIX + filePath.replace(/^\//, ''), displayName = escapeHTML(getDisplayFileName(filePath));
        html += `<span class="attachment-item" onclick="event.preventDefault(); window.open('${href}', '_blank')">${getFileIcon(filePath)} <span>${displayName}</span></span>`;
      });
      html += `</div>`;
    }
    html += `<div class="entry-footer"><div class="footer-contributor">${contributor ? `${SVG_ICONS.user} 贡献者: <span>${escapeHTML(contributor)}</span>` : ''}</div><div class="footer-actions"><span class="btn-action report" onclick="event.preventDefault(); window.location.href='${generateReportLink(uid)}'">${SVG_ICONS.warning} 举报</span></div></div>`;
    html += `</div></a>`;
    return html;
  }

  function renderRecordList() {
    const listContainer = document.getElementById('list');
    listContainer.innerHTML = '';
    if (filteredRecords.length === 0) { listContainer.innerHTML = `<div class="empty">暂无相关档案记录</div>`; return; }
    filteredRecords.forEach(r => { listContainer.insertAdjacentHTML('beforeend', buildCardHTML(r)); });
  }

  function applyFilters() {
    filteredRecords = allRecords.filter(record => {
      const categoryMatch = activeCategory === '全部' || extractPlainText(record['分区']) === activeCategory;
      const relatedMatch = activeRelated === '全部' || extractPlainText(record['内容主要参与人']) === activeRelated;
      let timeMatch = true;
      if (startDateFilter || endDateFilter) {
        const rt = getRecordTimeRange(record);
        if (!rt) timeMatch = false;
        else { const fs = startDateFilter ? new Date(startDateFilter).getTime() : 0; const fe = endDateFilter ? new Date(endDateFilter).getTime() + 86399000 : Infinity; if (rt[1] < fs || rt[0] > fe) timeMatch = false; }
      }
      let attachmentMatch = true;
      if (activeAttachmentType !== '全部') { const ac = getAttachmentCategory(record); if (activeAttachmentType === '图片') attachmentMatch = ac.includes('图片'); else if (activeAttachmentType === '文档') attachmentMatch = ac.includes('文档'); else if (activeAttachmentType === '无') attachmentMatch = ac === '无'; }
      const q = searchQuery.toLowerCase();
      const textMatch = !q || extractPlainText(record['内容标题']).toLowerCase().includes(q) || extractPlainText(record['内容详述']).toLowerCase().includes(q) || extractPlainText(record['投稿人昵称']).toLowerCase().includes(q) || extractPlainText(record['内容主要参与人']).toLowerCase().includes(q) || extractPlainText(record['UID']).toLowerCase().includes(q);
      return categoryMatch && relatedMatch && timeMatch && attachmentMatch && textMatch;
    });
    filteredRecords.sort((a, b) => (b['开始时间'] || b['投稿时间'] || 0) - (a['开始时间'] || a['投稿时间'] || 0));
    renderRecordList();
  }

  function initFilterControls() {
    const catSelect = document.getElementById('categorySelect'), relSelect = document.getElementById('relatedSelect');
    [...new Set(allRecords.map(r => extractPlainText(r['分区'])).filter(Boolean))].forEach(c => catSelect.innerHTML += `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`);
    [...new Set(allRecords.map(r => extractPlainText(r['内容主要参与人'])).filter(Boolean))].forEach(r => relSelect.innerHTML += `<option value="${escapeHTML(r)}">${escapeHTML(r)}</option>`);
    
    const params = new URLSearchParams(window.location.search);
    searchQuery = params.get('search') || ''; activeCategory = params.get('category') || '全部'; activeRelated = params.get('related') || '全部'; startDateFilter = params.get('dateStart') || ''; endDateFilter = params.get('dateEnd') || ''; activeAttachmentType = params.get('attachment') || '全部';
    
    document.getElementById('searchInput').value = searchQuery; catSelect.value = activeCategory; relSelect.value = activeRelated; document.getElementById('startDate').value = startDateFilter; document.getElementById('endDate').value = endDateFilter; document.getElementById('attachmentSelect').value = activeAttachmentType;
    
    catSelect.onchange = (e) => { activeCategory = e.target.value; applyFilters(); };
    relSelect.onchange = (e) => { activeRelated = e.target.value; applyFilters(); };
    document.getElementById('startDate').onchange = (e) => { startDateFilter = e.target.value; applyFilters(); };
    document.getElementById('endDate').onchange = (e) => { endDateFilter = e.target.value; applyFilters(); };
    document.getElementById('attachmentSelect').onchange = (e) => { activeAttachmentType = e.target.value; applyFilters(); };
    
    let st = null;
    document.getElementById('searchInput').oninput = (e) => { searchQuery = e.target.value.trim(); clearTimeout(st); st = setTimeout(() => applyFilters(), 300); };
    document.getElementById('resetAllBtn').onclick = () => {
      searchQuery = ''; activeCategory = '全部'; activeRelated = '全部'; startDateFilter = ''; endDateFilter = ''; activeAttachmentType = '全部';
      document.getElementById('searchInput').value = ''; catSelect.value = '全部'; relSelect.value = '全部'; document.getElementById('startDate').value = ''; document.getElementById('endDate').value = ''; document.getElementById('attachmentSelect').value = '全部';
      applyFilters();
    };
  }

  async function loadData() {
    initThemeToggle();
    try {
      const res = await fetch(DATA_URL);
      allRecords = await res.json();
      initFilterControls();
      applyFilters();
    } catch (err) { document.getElementById('list').innerHTML = `<div class="empty">数据加载失败。</div>`; }
  }
  loadData();
</script>
</body>
</html>
