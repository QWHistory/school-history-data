<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案详情 - 清湾档案馆（非官方）</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .back-btn { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 2rem; font-size: 0.95rem; font-family: "Microsoft YaHei", sans-serif; }
  .back-btn:hover { color: var(--primary); }
  .back-btn svg { width: 16px; height: 16px; }

  .detail-header { text-align: center; margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-color); }
  .detail-title { font-size: 2.2rem; font-weight: bold; color: var(--text-primary); margin-bottom: 1rem; word-break: break-all; }
  .detail-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem 2rem; font-size: 0.9rem; color: var(--text-tertiary); font-family: "Microsoft YaHei", sans-serif; }
  
  .detail-body { font-size: 1.1rem; line-height: 2; color: var(--text-primary); margin-bottom: 3rem; white-space: pre-wrap; word-break: break-all; text-align: justify; }
  
  /* 彻底重写附件区域，限制最大宽度，绝对不飘 */
  .detail-attachments { margin-bottom: 3rem; }
  .section-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 1rem; border-left: 4px solid var(--primary); padding-left: 0.5rem; font-family: "Microsoft YaHei", sans-serif; }
  .attachment-list { display: flex; flex-direction: column; gap: 1rem; }
  .attachment-item { 
    display: block; /* 改回 block，杜绝 flex 伸缩问题 */
    width: 100%; 
    max-width: 100%; 
    padding: 1rem; 
    background: var(--bg-surface); 
    border: 1px solid var(--border-color); 
    border-radius: 4px;
    color: var(--text-primary); 
    text-decoration: none; 
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
  }
  .attachment-item:hover { border-color: var(--primary); color: var(--primary); }
  
  .detail-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 2rem; border-top: 1px solid var(--border-color); font-family: "Microsoft YaHei", sans-serif; flex-wrap: wrap; gap: 1rem; }
  
  @media (max-width: 768px) {
    .detail-title { font-size: 1.6rem; }
    .detail-meta { flex-direction: column; align-items: center; gap: 0.5rem; }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">清湾校史档案 <span>非官方</span></a>
    <div class="nav-actions">
      <a href="/archive/" class="btn btn-outline">返回档案库</a>
      <button id="themeToggle" class="btn-icon">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        <svg id="icon-moon" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
      </button>
    </div>
  </nav>

  <!-- 统一使用居中容器 -->
  <div class="container" id="mainContent">
    <div style="text-align:center; padding: 4rem; color:var(--text-tertiary);">正在加载档案...</div>
  </div>

  <footer>
    清湾校史档案馆（非官方）· 数据由全校师生共建<br>
    本项目为公益性开源项目，与学校官方无关。
  </footer>

<script src="/assets/js/common.js"></script>
<script>
  const DATA_URL = '/data.json';
  const SVG_ICONS = {
    user: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>`,
    users: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>`,
    clock: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
    warning: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`
  };
  function getDisplayFileName(path) { return (path.split('/').pop() || path).replace(/^rec[a-zA-Z0-9]+_/, ''); }

  async function init() {
    initThemeToggle();
    const container = document.getElementById('mainContent');
    
    const path = window.location.pathname;
    let targetUid = '';
    if (path.includes('/record/')) {
      targetUid = path.split('/record/')[1].replace(/\/$/, ''); 
      targetUid = decodeURIComponent(targetUid).trim();
    }

    if (!targetUid) { container.innerHTML = `<div style="text-align:center;">未提供有效编号。<br><br><a href="/archive/" class="btn btn-primary">返回列表</a></div>`; return; }

    try {
      const res = await fetch(DATA_URL);
      const allRecords = await res.json();
      const record = allRecords.find(r => extractPlainText(r['UID']).trim() === targetUid);

      if (!record) { container.innerHTML = `<div style="text-align:center;">未找到编号为 ${targetUid} 的档案。<br><br><a href="/archive/" class="btn btn-primary">返回列表</a></div>`; return; }
      
      const category = extractPlainText(record['分区']), title = extractPlainText(record['内容标题']) || '无标题';
      const uid = extractPlainText(record['UID']), related = extractPlainText(record['内容主要参与人']);
      const timeRange = formatTimeRange(record['开始时间'], record['结束时间'], record['投稿时间']);
      const body = extractPlainText(record['内容详述']), contributor = extractPlainText(record['投稿人昵称']);
      document.title = `${title} - 清湾档案馆（非官方）`;

      let html = `<a href="/archive/" class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg> 返回档案库</a>`;
      
      html += `<div class="detail-header">`;
      if (category) html += `<div style="margin-bottom:0.5rem;"><span class="tag" style="border:1px solid var(--primary); padding:0.1rem 0.4rem; font-size:0.8rem; color:var(--primary);">${escapeHTML(category)}</span></div>`;
      html += `<h1 class="detail-title">${escapeHTML(title)}</h1>`;
      html += `<div class="detail-meta">`;
      html += `<span>编号: ${escapeHTML(uid)}</span>`;
      if (timeRange) html += `<span>${SVG_ICONS.clock} ${escapeHTML(timeRange)}</span>`;
      if (related) html += `<span>${SVG_ICONS.users} 有关人: ${escapeHTML(related)}</span>`;
      if (contributor) html += `<span>${SVG_ICONS.user} 贡献者: ${escapeHTML(contributor)}</span>`;
      html += `</div></div>`;

      html += `<div class="detail-body">${escapeHTML(body || '暂无详细内容')}</div>`;

      const attachments = record['attachments'] || [];
      if (attachments.length > 0) {
        html += `<div class="detail-attachments"><div class="section-title">相关附件</div><div class="attachment-list">`;
        attachments.forEach(p => {
          const href = '/' + p.replace(/^\//, '');
          const name = p.split('/').pop().replace(/^rec[a-zA-Z0-9]+_/, '');
          html += `<a href="${href}" class="attachment-item" target="_blank" rel="noopener">📎 ${escapeHTML(name)}</a>`;
        });
        html += `</div></div>`;
      }
      
      html += `<div class="detail-footer"><span style="font-size:0.85rem; color:var(--text-tertiary);">本页面链接可直接分享</span><a class="btn btn-outline" href="${generateReportLink(uid)}" style="text-decoration:none;">举报违规内容</a></div>`;
      
      container.innerHTML = html;
    } catch (e) { container.innerHTML = `<div style="text-align:center; color:red;">加载失败，请检查 data.json。</div>`; }
  }
  init();
</script>
</body>
</html>
